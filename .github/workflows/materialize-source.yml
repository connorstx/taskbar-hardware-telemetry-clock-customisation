name: Materialize source

on:
  push:
    paths:
      - 'payload/*.b64part'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode source
        shell: bash
        run: |
          cat payload/*.b64part | base64 -d | gzip -d > taskbar-hardware-telemetry-clock-customisation.wh.cpp

      - name: Commit generated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add taskbar-hardware-telemetry-clock-customisation.wh.cpp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Windhawk mod source"
          git push
